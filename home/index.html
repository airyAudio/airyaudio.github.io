    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">

<body>

<header class="nav">
    <div class="wrap">
        <a class="brand" href="./"><img src="../images/icon-64.png" alt="">Airy Audio</a>
        <nav class="nav-links">
            <a href="./">Home</a>
            <a href="../more/">More</a>
        </nav>
    </div>
</header>

<main class="launch-page">
    <div class="wrap">
        <div class="section-head">
            <h1>Apps</h1>
            <p>Choose an app for help, features and privacy.</p>
        </div>

        <section class="launchpad" aria-label="Mac apps">
            <h2 class="launch-label">Mac</h2>
            <div class="launch-grid">
                <a class="launch-app" href="../">
                    <img src="../images/icon-512.png" width="512" height="512" alt="">

                </a>
                <a class="launch-app" href="../more/mixy/">
                    <img src="../more/mixy/images/icon-512.png" width="512" height="512" alt="">

                </a>
                <a class="launch-app" href="../more/conventional-mouse/">
                    <img src="../more/conventional-mouse/images/icon-512.png" width="512" height="512" alt="">
                    <span>Conventional Mouse</span>
                </a>
            </div>
        </section>

        <section class="startmenu" aria-label="Windows apps">
            <div class="start-head">
                <h2>Windows</h2>
            </div>
            <div class="start-grid">
                <a class="start-app" href="../more/airy-windows/">
                    <img src="../images/icon-180.png" width="180" height="180" alt="">
                    <span>Airy</span>

<footer>
    <div class="wrap">
